<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | JB STORE</title>

    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ── RESET & BASE ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0 0 82px;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.035), transparent 30%), #0a0a0a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        .product-header {
            width: 100%;
            height: 70px;
            padding: 0 clamp(18px, 4vw, 60px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.94);
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(18px);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.13);
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .back-btn:hover {
            color: #fff;
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateX(-3px);
        }

        .product-logo {
    color: #D4AF37;
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    letter-spacing: 1px;
}

.product-logo span {
    color: #FFFFFF;
}

        /* ==============================================
                   FLIPKART-STYLE PRODUCT PAGE
                   ============================================== */

        /* ── MAIN LAYOUT ── */
        .product-page {
            width: min(94%, 1380px);
            margin: 28px auto 40px;
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            gap: clamp(24px, 3.5vw, 48px);
            align-items: start;
            animation: fadeInUp 0.45s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── LEFT COLUMN: IMAGE GALLERY ── */
        .product-image-section {
            min-width: 0;
            position: relative;
        }

        /* ── GALLERY FIX: no peeking ── */
        .product-image-box {
    touch-action: pan-y;
    cursor: grab;
    overflow: hidden !important;
    isolation: isolate;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 0;
    padding: 0;
}


        .product-image-box.dragging {
            cursor: grabbing;
        }

        .gallery-track {
            display: flex;
            flex-wrap: nowrap;
            height: 100%;
            width: 100%;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
            user-select: none;
        }

        .gallery-track.is-dragging {
            transition: none !important;
        }

        .gallery-track.is-snapping {
            transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1) !important;
        }

        .gallery-slide {
    flex: 0 0 auto;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0;
    background: transparent;
}

        .gallery-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: transform 0.25s ease;
    pointer-events: none;
    user-select: none;
}

        .product-image-box:hover .gallery-slide img {
            transform: scale(1.01);
        }

        .product-offer {
    display: none !important;
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 5;
    padding: 5px 14px;
    background: linear-gradient(135deg, #d4af37, #f3cf55);
    color: #080808;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 800;
}

        /* ── THUMBNAIL STRIP ── */
        .thumbnail-strip-wrap {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .thumbnail-strip {
            display: flex;
            gap: 8px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.25) transparent;
            padding: 4px 2px 8px 2px;
        }

        .thumbnail-strip::-webkit-scrollbar {
            height: 3px;
        }

        .thumbnail-strip::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.35);
            border-radius: 10px;
        }

        .thumbnail-strip .thumb-item {
            flex: 0 0 72px;
            width: 72px;
            height: 72px;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            scroll-snap-align: start;
            transition: 0.25s ease;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 4px;
        }

        .thumbnail-strip .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .thumbnail-strip .thumb-item:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .thumbnail-strip .thumb-item.active-thumb {
            border-color: #d4af37 !important;
            box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.2), 0 0 18px rgba(212, 175, 55, 0.08);
        }

        /* ── IMAGE DOTS ── */
        .image-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-height: 14px;
            margin-top: 10px;
        }

        .image-dot {
            width: 6px;
            height: 6px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .image-dot.active {
            width: 8px;
            height: 8px;
            background: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* ── COLOR SECTION ── */
        .color-section {
            margin-top: 16px;
            padding: 16px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
        }

        .color-section label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .color-section label span {
            color: #d4af37;
        }

        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 18px;
        }

        .color-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: 0.25s ease;
            min-width: 60px;
        }

        .color-opt .swatch {
    width: 76px;
    height: 76px;
    border-radius: 14px;
    object-fit: contain;
    background: #0b0b0b;
    border: 2px solid rgba(255, 255, 255, 0.08);
    transition: 0.25s ease;
    padding: 5px;
}

        .color-opt:hover .swatch {
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }

        .color-opt.active .swatch {
            border-color: #d4af37 !important;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15), 0 0 24px rgba(212, 175, 55, 0.12);
        }

        .color-opt .color-name {
            color: #bdbdbd;
            font-size: 10px;
            font-weight: 500;
            text-align: center;
            line-height: 1.3;
            max-width: 72px;
            white-space: normal;
            overflow: visible;
        }

        .color-opt.active .color-name {
            color: #d4af37;
        }

        /* ── VARIANT SECTION ── */
        .variant-section {
            margin-top: 12px;
            padding: 16px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
        }

        .variant-section label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .variant-section label span {
            color: #d4af37;
        }

        .variant-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        .variant-options .opt {
            min-width: 0;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #101010;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            color: #bdbdbd;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s ease;
            text-align: center;
        }

        .variant-options .opt:hover {
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }

        .variant-options .opt.active {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.07);
            border-color: #d4af37;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.08);
        }

        .variant-options .opt .variant-price {
            margin-top: 3px;
            color: #d4af37;
            font-size: 14px;
            font-weight: 700;
        }

        /* ── RIGHT COLUMN ── */
        .product-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-card {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 14px;
            transition: 0.25s ease;
        }

        .info-card:hover {
            border-color: rgba(212, 175, 55, 0.10);
        }

    

        .product-name {
            margin: 0;
            color: #fff;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: 700;
            line-height: 1.25;
        }

        /* Hide Brand + Rating */
.product-brand {
    display: none !important;
}

.product-rating {
    display: none !important;
}

        .product-rating .stars {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: linear-gradient(135deg, #388e3c, #43a047);
            color: #fff;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .product-rating .review-count {
            color: #777;
            font-size: 12px;
        }

        .product-price {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 8px 0 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-price .current {
            color: #d4af37;
            font-size: clamp(24px, 2.5vw, 32px);
            font-weight: 700;
        }

        .product-price .old {
            color: #666;
            font-size: 15px;
            text-decoration: line-through;
        }

        .product-price .discount-badge {
            padding: 3px 10px;
            color: #4ecdc4;
            background: rgba(78, 205, 196, 0.08);
            border: 1px solid rgba(78, 205, 196, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .condition-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .condition-row span {
            color: #777;
            font-size: 12px;
        }

        .condition-row strong {
            padding: 3px 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 12px;
        }

        /* ── SPECIFICATIONS ── */
        .specs-section h2 {
            margin: 0 0 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .specs-section h2::after {
            content: '';
            display: block;
            width: 32px;
            height: 2px;
            margin-top: 5px;
            background: linear-gradient(90deg, #d4af37, transparent);
            border-radius: 2px;
        }

        .spec-row {
            min-height: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.035);
            font-size: 12px;
        }

        .spec-row:last-child {
            border-bottom: none;
        }

        .spec-row span {
            color: #777;
            flex-shrink: 0;
        }

        .spec-row strong {
            max-width: 62%;
            color: #e8e8e8;
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }

        /* ── WARRANTY ── */
        .warranty {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            color: #ccc;
            font-size: 12px;
        }

        .warranty strong {
            padding: 3px 11px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.06);
            border-radius: 20px;
            font-weight: 600;
        }

        /* ── DESCRIPTION ── */
        .product-description {
            margin: 0;
            color: #b8b8b8;
            font-size: 13px;
            line-height: 1.75;
        }

        /* ── ACTION BUTTONS ── */
        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .product-actions button {
            min-height: 46px;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .product-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }

        .whatsapp-btn {
            color: #fff;
            background: linear-gradient(135deg, #25d366, #1da851);
        }

        .call-btn {
            color: #0a0a0a;
            background: linear-gradient(135deg, #d4af37, #f3cf55);
        }

        /* ── SIMILAR PRODUCTS ── */
        .similar-products {
            min-width: 0;
        }

        .similar-products h3 {
            margin: 0 0 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .similar-products h3 span {
            color: #d4af37;
        }

        .similar-scroll {
            display: flex;
            gap: 12px;
            padding: 3px 2px 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.2) transparent;
        }

        .similar-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .similar-scroll::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }

        .similar-item {
            min-width: 140px;
            flex: 0 0 140px;
            padding: 12px 10px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            scroll-snap-align: start;
            transition: 0.25s ease;
        }

        .similar-item:hover {
            border-color: rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
        }

        .similar-item img {
            width: 100%;
            height: 100px;
            display: block;
            padding: 6px;
            object-fit: contain;
            background: #0a0a0a;
            border-radius: 7px;
        }

        .similar-item .s-name {
            min-height: 34px;
            margin-top: 7px;
            color: #e8e8e8;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
        }

        .similar-item .s-price {
            margin-top: 3px;
            color: #d4af37;
            font-size: 13px;
            font-weight: 600;
        }

        /* ── STICKY CART BAR ── */
        .sticky-cart-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 999;
            min-height: 68px;
            padding: 9px clamp(15px, 4vw, 60px);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(13, 13, 13, 0.97);
            border-top: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(18px);
        }

        .sticky-cart-bar .price-tag {
            flex: 0 0 auto;
            color: #d4af37;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .sticky-cart-bar .price-tag small {
            color: #666;
            font-size: 13px;
            font-weight: 400;
            text-decoration: line-through;
            margin-left: 6px;
        }

        .sticky-cart-bar button {
            min-height: 44px;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .sticky-cart-bar button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }

        .sticky-cart-bar .cart-btn,
        .sticky-cart-bar .buy-btn {
            flex: 1;
        }

        .sticky-cart-bar .cart-btn {
            color: #fff;
            background: linear-gradient(135deg, #25d366, #1da851);
        }

        .sticky-cart-bar .buy-btn {
            color: #0a0a0a;
            background: linear-gradient(135deg, #d4af37, #f3cf55);
        }

        /* ── TOAST ── */
        .toast-notification {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            animation: toastIn 0.3s ease;
            backdrop-filter: blur(12px);
            max-width: 90%;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        .toast-notification.fade-out {
            opacity: 0;
            transform: translateX(-50%) translateY(20px) scale(0.95);
            transition: 0.3s ease;
        }

        .toast-notification button {
            background: transparent;
            border: none;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
        }

        .toast-notification button:hover {
            color: #fff;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 920px) {
            .product-page {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 820px) {
            .product-page {
                grid-template-columns: 1fr;
                gap: 24px;
                width: min(96%, 600px);
            }
            .product-image-box {
                aspect-ratio: 1 / 1;
                max-height: 500px;
            }
            .thumbnail-strip .thumb-item {
                flex: 0 0 60px;
                width: 60px;
                height: 60px;
            }
            .color-opt .swatch {
    width: 72px;
    height: 72px;
    padding: 5px;
    border-radius: 13px;
}
            .variant-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .product-page {
                width: 96%;
                margin: 16px auto 30px;
                gap: 18px;
            }
              .product-image-box {
        aspect-ratio: 1 / 1.05;
        max-height: 400px;
        padding: 0;
        border-radius: 0;
        background: #ffffff;
    }
            .gallery-slide {
        padding: 0;
        background: transparent;
            }
            .gallery-slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
            .thumbnail-strip .thumb-item {
                flex: 0 0 52px;
                width: 52px;
                height: 52px;
                padding: 3px;
            }
            .color-opt .swatch {
    width: 72px;
    height: 72px;
    padding: 5px;
    border-radius: 13px;
}
            .color-options {
                gap: 10px 14px;
            }
            .variant-options {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .variant-options .opt {
                padding: 8px 6px;
                font-size: 11px;
            }
            .variant-options .opt .variant-price {
                font-size: 13px;
            }
            .product-actions {
                grid-template-columns: 1fr;
            }
            .product-actions button {
                min-height: 42px;
                font-size: 12px;
            }
            .info-card {
                padding: 14px 16px;
            }
            .similar-item {
                min-width: 120px;
                flex: 0 0 120px;
                padding: 10px 8px;
            }
            .similar-item img {
                height: 80px;
            }
            .sticky-cart-bar {
                min-height: 60px;
                padding: 8px 14px;

    <!-- ─── SCRIPTS ─── -->
    <script src="config.js"></script>
    <script src="mobiles.js"></script>
    <script src="refrigerator.js"></script>

    <script src="tv.js"></script>

    <script>
        // ==========================================
        // ALL PRODUCTS
        // ==========================================
        let allProducts = [];
        let currentProduct = null;
        let selectedColorName = null;
        let selectedVariantLabel = null;
        let selectedVariantPrice = 0;
        let selectedVariantOldPrice = 0;

        // ==========================================
        // TOAST
        // ==========================================
        function showToast(msg) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()">✕</button>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // GET PRODUCT ID
        // ==========================================
        function getProductIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || params.get('product') || params.get('p');
        }

        // ==========================================
        // GALLERY – NO PEEKING FIX
        // ==========================================
        function updateGallery(images) {
            const box = document.getElementById('galleryContainer');
            const track = document.getElementById('galleryTrack');
            const strip = document.getElementById('thumbnailStrip');
            const dots = document.getElementById('imageDots');

            if (!box || !track || !strip || !dots) return;

            strip.innerHTML = '';
            dots.innerHTML = '';
            track.innerHTML = '';

            const validImages = (images || []).filter(src =>
                typeof src === 'string' && src.trim() !== ''
            );

            if (validImages.length === 0) {
                dots.style.display = 'none';
                strip.style.display = 'none';
                return;
            }

            dots.style.display = 'flex';
            strip.style.display = 'flex';

            let currentIndex = 0;
            let startX = 0;
            let startY = 0;
            let currentTranslate = 0;
            let dragStartTranslate = 0;
            let isDragging = false;
            let moved = false;

            // Build slides
            validImages.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = 'gallery-slide';
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Product image ${index + 1}`;
                img.draggable = false;
                slide.appendChild(img);
                track.appendChild(slide);
            });

            // --- Helper: get the inner content width of the box (excludes padding) ---
            function getSlideWidth() {
                const cs = getComputedStyle(box);
                const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
                return Math.max(1, box.clientWidth - padX);
            }

            // --- Size track & slides so each slide is exactly the visible width ---
            function syncGalleryGeometry() {
                const slideWidth = getSlideWidth();
                const count = validImages.length;

                // Make the track wide enough to hold all slides side-by-side
                track.style.width = `${slideWidth * count}px`;
                track.style.height = '100%';

                const slides = track.querySelectorAll('.gallery-slide');
                slides.forEach((slide) => {
                    slide.style.width = `${slideWidth}px`;
                    slide.style.minWidth = `${slideWidth}px`;
                    slide.style.maxWidth = `${slideWidth}px`;
                    slide.style.height = '100%';
                    slide.style.flex = '0 0 auto';
                });

                // If we're already on a valid index, re-apply the translate
                if (currentIndex >= 0 && currentIndex < count) {
                    currentTranslate = -currentIndex * slideWidth;
                    track.style.transform = `translate3d(${currentTranslate}px, 0, 0)`;
                }
            }

            // --- Show a specific slide by index ---
            function showImage(index, animate = true) {
                if (index < 0) index = 0;
                if (index > validImages.length - 1) index = validImages.length - 1;

                currentIndex = index;
                const slideWidth = getSlideWidth();
                currentTranslate = -index * slideWidth;

                // Apply the transform
                track.classList.toggle('is-dragging', !animate);
                track.classList.toggle('is-snapping', animate);
                track.style.transform = `translate3d(${currentTranslate}px, 0, 0)`;

                // Update thumbnails
                const thumbs = strip.querySelectorAll('.thumb-item');
                thumbs.forEach((el, i) => {
                    el.classList.toggle('active-thumb', i === currentIndex);
                });

                // Update dots
                const dotEls = dots.querySelectorAll('.image-dot');
                dotEls.forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentIndex);
                });

                // Scroll active thumbnail into view
                const activeThumb = strip.querySelector('.active-thumb');
                if (activeThumb) {
                    activeThumb.scrollIntoView({
                        behavior: animate ? 'smooth' : 'auto',
                        inline: 'center',
                        block: 'nearest'
                    });
                }
            }

            // --- Build thumbnails ---
            validImages.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'thumb-item' + (index === 0 ? ' active-thumb' : '');
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Thumbnail ${index + 1}`;
                img.loading = 'lazy';
                item.appendChild(img);
                item.addEventListener('click', () => showImage(index, true));
                strip.appendChild(item);
            });

            // --- Build dots ---
            validImages.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'image-dot' + (index === 0 ? ' active' : '');
                dot.setAttribute('aria-label', `Image ${index + 1}`);
                dot.addEventListener('click', () => showImage(index, true));
                dots.appendChild(dot);
            });

            // --- Initial sizing & positioning ---
            syncGalleryGeometry();
            showImage(0, false);

            // --- Re-sync on resize ---
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    syncGalleryGeometry();
                    showImage(currentIndex, false);
                }, 80);
            });

            // ── TOUCH EVENTS ──
            function onTouchStart(e) {
                if (!e.touches || !e.touches[0]) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dragStartTranslate = currentTranslate;
                isDragging = true;
                moved = false;
                box.classList.add('dragging');
                track.classList.add('is-dragging');
            }

            function onTouchMove(e) {
                if (!isDragging || !e.touches || !e.touches[0]) return;
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;

                // Allow vertical page scroll if mostly vertical
                if (Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 10) return;
                moved = true;

                let next = dragStartTranslate + dx;
                const slideWidth = getSlideWidth();
                const maxTranslate = -(validImages.length - 1) * slideWidth;

                // Rubber-band at edges
                if (currentIndex === 0 && dx > 0) {
                    next = dragStartTranslate + dx * 0.28;
                } else if (currentIndex === validImages.length - 1 && dx < 0) {
                    next = dragStartTranslate + dx * 0.28;
                }

                // Clamp to prevent overshoot
                if (next > 0) next = 0;
                if (next < maxTranslate) next = maxTranslate;

                track.style.transform = `translate3d(${next}px, 0, 0)`;
            }

            function onTouchEnd(e) {
                if (!isDragging) return;
                const dx = e.changedTouches[0].clientX - startX;
                const slideWidth = getSlideWidth();
                const threshold = Math.max(40, slideWidth * 0.18);

                isDragging = false;
                box.classList.remove('dragging');

                if (moved && Math.abs(dx) >= threshold) {
                    if (dx < 0 && currentIndex < validImages.length - 1) {
                        showImage(currentIndex + 1, true);
                        return;
                    }
                    if (dx > 0 && currentIndex > 0) {
                        showImage(currentIndex - 1, true);
                        return;
                    }
                }
                showImage(currentIndex, true);
            }

            box.addEventListener('touchstart', onTouchStart, { passive: true });
            box.addEventListener('touchmove', onTouchMove, { passive: true });
            box.addEventListener('touchend', onTouchEnd, { passive: true });

            // ── MOUSE DRAG ──
            let mouseDown = false;
            box.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                mouseDown = true;
                startX = e.clientX;
                dragStartTranslate = currentTranslate;
                moved = false;
                box.classList.add('dragging');
                track.classList.add('is-dragging');
            });

            window.addEventListener('mousemove', e => {
                if (!mouseDown) return;
                const dx = e.clientX - startX;
                if (Math.abs(dx) > 4) moved = true;

                let next = dragStartTranslate + dx;
                const slideWidth = getSlideWidth();
                const maxTranslate = -(validImages.length - 1) * slideWidth;

                if (currentIndex === 0 && dx > 0) next = dragStartTranslate + dx * 0.28;
                if (currentIndex === validImages.length - 1 && dx < 0) next = dragStartTranslate + dx * 0.28;
                if (next > 0) next = 0;
                if (next < maxTranslate) next = maxTranslate;

                track.style.transform = `translate3d(${next}px, 0, 0)`;
            });

            window.addEventListener('mouseup', e => {
                if (!mouseDown) return;
                mouseDown = false;
                box.classList.remove('dragging');

                const dx = e.clientX - startX;
                const slideWidth = getSlideWidth();
                const threshold = Math.max(40, slideWidth * 0.18);

                if (moved && Math.abs(dx) >= threshold) {
                    if (dx < 0 && currentIndex < validImages.length - 1) {
                        showImage(currentIndex + 1, true);
                        return;
                    }
                    if (dx > 0 && currentIndex > 0) {
                        showImage(currentIndex - 1, true);
                        return;
                    }
                }
                showImage(currentIndex, true);
            });

            // ── Cleanup function for when gallery updates ──
            // (Store cleanup in a closure for potential later use)
            const cleanup = () => {
                // No-op for now; event listeners are on the box and window
            };
        }

        // ==========================================
        // LOAD COLORS
        // ==========================================
        function loadColors(product) {
            const container = document.getElementById('colorOptions');
            const section = document.getElementById('colorSection');
            container.innerHTML = '';

            const colors = product.colors || [];
            if (!colors || colors.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';

            // Determine first color's images
            let firstImages = [];
            if (colors[0].images && colors[0].images.length > 0) {
                firstImages = colors[0].images;
            } else if (colors[0].image) {
                firstImages = [colors[0].image];
            }
            updateGallery(firstImages);

            colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'color-opt' + (index === 0 ? ' active' : '');
                btn.dataset.index = index;

                let colorImages = [];
                if (color.images && color.images.length > 0) {
                    colorImages = color.images;
                } else if (color.image) {
                    colorImages = [color.image];
                }

                const swatch = document.createElement('img');
                swatch.className = 'swatch';
                swatch.src = colorImages[0] || '';
                swatch.alt = color.name || '';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'color-name';
                nameSpan.textContent = color.name || '';

                btn.appendChild(swatch);
                btn.appendChild(nameSpan);

                btn.addEventListener('click', function() {
                    document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    selectedColorName = this.querySelector('.color-name').textContent;
                    updateGallery(colorImages);
                    showToast(`Selected: ${selectedColorName}`);
                });

                container.appendChild(btn);
            });
        }

        // ==========================================
        // LOAD VARIANTS
        // ==========================================
        function loadVariants(product) {
            const container = document.getElementById('variantOptions');
            container.innerHTML = '';
            const variants = product.variants || [
                { label: 'Default', price: product.price, oldPrice: product.oldPrice || product.price * 1.3 }
            ];

            variants.forEach((variant, index) => {
                const el = document.createElement('button');
                el.className = 'opt' + (index === 0 ? ' active' : '');
                el.innerHTML = `
                            <span>${variant.label}</span>
                            <span class="variant-price">₹${variant.price.toLocaleString('en-IN')}</span>
                        `;
                el.dataset.price = variant.price;
                el.dataset.oldPrice = variant.oldPrice || variant.price * 1.3;
                el.dataset.label = variant.label;

                if (index === 0) {
                    selectedVariantLabel = variant.label;
                    selectedVariantPrice = variant.price;
                    selectedVariantOldPrice = variant.oldPrice || variant.price * 1.3;
                }

                el.addEventListener('click', function() {
                    document.querySelectorAll('.variant-options .opt').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const price = parseInt(this.dataset.price);
                    const oldPrice = parseInt(this.dataset.oldPrice);
                    const label = this.dataset.label;
                    updateProductPrice(price, oldPrice, label);
                    showToast(`Selected: ${label}`);
                });
                container.appendChild(el);
            });
        }

        // ==========================================
        // UPDATE PRICE
        // ==========================================
        function updateProductPrice(price, oldPrice, variantLabel) {
            selectedVariantLabel = variantLabel;
            selectedVariantPrice = price;
            selectedVariantOldPrice = oldPrice;
            document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
            document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
            const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
            document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
            document.getElementById('stickyPrice').innerHTML =
                `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;
        }

        // ==========================================
        // LOAD SIMILAR
        // ==========================================
        function loadSimilarProducts(product) {
            const similar = allProducts.filter(p => p.id !== product.id && p.category === product.category).slice(0, 6);
            const container = document.getElementById('similarScroll');
            container.innerHTML = '';
            if (similar.length === 0) {
                container.innerHTML = '<p style="color:#666;font-size:13px;padding:8px 0;">No similar products found.</p>';
                return;
            }
            similar.forEach(p => {
                const div = document.createElement('div');
                div.className = 'similar-item';
                div.onclick = () => window.location.href = `product.html?id=${p.id}`;
                div.innerHTML = `
                            <img src="${p.image || p.images?.[0] || ''}" alt="${p.name}" loading="lazy">
                            <div class="s-name">${p.name}</div>
                            <div class="s-price">₹${(p.price || 0).toLocaleString('en-IN')}</div>
                        `;
                container.appendChild(div);
            });
        }

        // ==========================================
        // RENDER PRODUCT
        // ==========================================
        function renderProduct(product) {
            currentProduct = product;
            document.title = product.name + ' | JB STORE';

            // Basic info
            document.getElementById('productName').innerText = product.name || '';
            document.getElementById('productBrand').innerText = product.brand || '';
            document.getElementById('productRating').innerHTML = `⭐ ${product.rating || '4.5'}`;
            document.getElementById('productReviews').innerText = `(${product.reviews || '0'} reviews)`;
            document.getElementById('productCondition').innerText = product.condition || 'New';
            document.getElementById('productWarranty').innerText = product.warranty || '1 Year';
            document.getElementById('productDescription').innerText = product.description || '';
            document.getElementById('productOffer').innerText = product.discount || '';

            // Prices
            const price = product.price || 0;
            const oldPrice = product.oldPrice || price * 1.3;
            document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
            document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
            const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
            document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
            document.getElementById('stickyPrice').innerHTML =
                `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;

            // Specs
            const specList = document.getElementById('specList');
            specList.innerHTML = '';
            const specMap = {
                'Brand': product.brand,
                'Storage': product.storage,
                'RAM': product.ram,
                'Capacity': product.capacity,
                'Type': product.type,
                'Energy Rating': product.energyRating,
                'Size': product.size,
                'Resolution': product.resolution,
                'Color': product.color,
                'Model': product.model,
                'Weight': product.weight,
                'Dimensions': product.dimensions,
                'Condition': product.condition
            };
            let hasSpecs = false;
            for (const [key, val] of Object.entries(specMap)) {
                if (val) {
                    hasSpecs = true;
                    specList.innerHTML += `<div class="spec-row"><span>${key}</span><strong>${val}</strong></div>`;
                }
            }
            if (!hasSpecs) {
                specList.innerHTML =
                    `<div style="color:#666;text-align:center;padding:8px 0;font-size:13px;">No specifications available</div>`;
            }

            // Load dynamic sections
            loadColors(product);
            loadVariants(product);
            loadSimilarProducts(product);
        }

        // ==========================================
        // LOAD PRODUCT
        // ==========================================
        function loadProduct() {
            let productId = getProductIdFromURL();
            let productData = null;

            if (productId) {
                productData = allProducts.find(p => p.id === productId);
            }
            if (!productData) {
                const saved = JSON.parse(localStorage.getItem('selectedProduct'));
                if (saved) {
                    productData = allProducts.find(p => p.id === saved.id);
                }
            }
            if (!productData && allProducts.length > 0) {
                productData = allProducts[0];
            }

            if (!productData) {
                document.getElementById('productPage').innerHTML = `
                            <div style="text-align:center;padding:60px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:16px;">
                                <div style="font-size:50px;margin-bottom:16px;">🔍</div>
                                <h2 style="color:#D4AF37;font-size:24px;">Product Not Found</h2>
                                <p style="color:#888;margin:8px 0 20px;font-size:14px;">The product you're looking for doesn't exist.</p>
                                <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
                            </div>
                        `;
                return;
            }
            renderProduct(productData);
        }

        // ==========================================
        // ACTIONS
        // ==========================================
        function contactWhatsApp() {
            if (!currentProduct) return;
            const price = document.getElementById('productPrice').innerText;
            const color = selectedColorName ? ` (Color: ${selectedColorName})` : '';
            const variant = selectedVariantLabel ? ` (Variant: ${selectedVariantLabel})` : '';
            const msg =
                `Hello JB STORE, I am interested in ${currentProduct.name}${color}${variant}. Price: ${price}.`;
            window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function callStore() {
            window.location.href = `tel:${STORE_PHONE}`;
        }

        function addToCartFromProduct() {
            if (!currentProduct) {
                showToast('Product not found!');
                return;
            }
            const variantLabel = selectedVariantLabel || 'Default';
            const price = selectedVariantPrice || currentProduct.price;
            const colorName = selectedColorName || '';

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const variantKey = variantLabel !== 'Default' ? `_${variantLabel}` : '';
            const colorKey = colorName ? `_${colorName}` : '';
            const uniqueId = `${currentProduct.id}${variantKey}${colorKey}`;
            const existingItem = cart.find(item => item.id === uniqueId);

            let displayName = currentProduct.name;
            if (variantLabel !== 'Default') displayName += ` (${variantLabel})`;
            if (colorName) displayName += ` · ${colorName}`;

            if (existingItem) {
                existingItem.quantity += 1;
                showToast(`📦 ${displayName} quantity updated!`);
            } else {
                cart.push({
                    id: uniqueId,
                    name: currentProduct.name,
                    brand: currentProduct.brand,
                    price: price,
                    image: currentProduct.image || currentProduct.images?.[0] || '',
                    quantity: 1,
                    variant: variantLabel,
                    color: colorName
                });
                showToast(`✅ ${displayName} added to cart!`);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function buyNow() {
            addToCartFromProduct();
            setTimeout(() => window.location.href = 'cart.html', 600);
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.querySelectorAll('.cart-badge').forEach(b => {
                b.textContent = total;
                b.style.display = total > 0 ? 'flex' : 'none';
            });
        }

        // ==========================================
        // INIT
        // ==========================================
        function init() {
            allProducts = [
                ...(typeof mobileProducts !== "undefined" ? mobileProducts : []),
                ...(typeof refrigeratorProducts !== "undefined" ? refrigeratorProducts : []),
                ...(typeof washingProducts !== "undefined" ? washingProducts : []),
                ...(typeof acProducts !== "undefined" ? acProducts : []),
                ...(typeof tvProducts !== "undefined" ? tvProducts : [])
            ];

            if (allProducts.length === 0) {
                document.getElementById('productPage').innerHTML = `
                            <div style="text-align:center;padding:60px 20px;grid-column:1/-1;background:linear-gradient(145deg,#1A1A1A,#111111);border:1px solid rgba(255,215,0,0.08);border-radius:16px;">
                                <div style="font-size:50px;margin-bottom:16px;">⚠️</div>
                                <h2 style="color:#D4AF37;font-size:24px;">No Products Loaded</h2>
                                <p style="color:#888;margin:8px 0 20px;font-size:14px;">Please check your data files.</p>
                                <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
                            </div>
                        `;
                return;
            }
            loadProduct();
            updateCartBadge();
        }

        // Start
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(init, 100);
        } else {
            document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
        }
        window.addEventListener('load', () => {
            if (allProducts.length === 0) setTimeout(init, 200);
        });
    </script>

</body>

</html>
