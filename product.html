<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | JB STORE</title>

    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        /* ── RESET & BASE ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0 0 82px;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.035), transparent 30%), #0a0a0a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        .product-header {
            width: 100%;
            height: 70px;
            padding: 0 clamp(18px, 4vw, 60px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.94);
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(18px);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.13);
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .back-btn:hover {
            color: #fff;
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateX(-3px);
        }

        .product-logo {
            color: #D4AF37;
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .product-logo span {
            color: #FFFFFF;
        }

        /* ==============================================
                   FLIPKART-STYLE PRODUCT PAGE
                   ============================================== */

        /* ── MAIN LAYOUT ── */
        .product-page {
            width: min(94%, 1380px);
            margin: 28px auto 40px;
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            gap: clamp(24px, 3.5vw, 48px);
            align-items: start;
            animation: fadeInUp 0.45s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── LEFT COLUMN: IMAGE GALLERY ── */
        .product-image-section {
            min-width: 0;
            position: relative;
        }

        .product-image-box {
            touch-action: pan-y;
            cursor: grab;
            overflow: hidden !important;
            isolation: isolate;
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 0;
            padding: 0;
        }

        .product-image-box.dragging {
            cursor: grabbing;
        }

        .gallery-track {
            display: flex;
            flex-wrap: nowrap;
            height: 100%;
            width: 100%;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
            user-select: none;
        }

        .gallery-track.is-dragging {
            transition: none !important;
        }

        .gallery-track.is-snapping {
            transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1) !important;
        }

        .gallery-slide {
            flex: 0 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0;
            background: transparent;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.25s ease;
            pointer-events: none;
            user-select: none;
        }

        .product-image-box:hover .gallery-slide img {
            transform: scale(1.01);
        }

        .product-offer {
            display: none !important;
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            padding: 5px 14px;
            background: linear-gradient(135deg, #d4af37, #f3cf55);
            color: #080808;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
        }

        /* ── THUMBNAIL STRIP ── */
        .thumbnail-strip-wrap {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .thumbnail-strip {
            display: flex;
            gap: 8px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.25) transparent;
            padding: 4px 2px 8px 2px;
        }

        .thumbnail-strip::-webkit-scrollbar {
            height: 3px;
        }

        .thumbnail-strip::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.35);
            border-radius: 10px;
        }

        .thumbnail-strip .thumb-item {
            flex: 0 0 72px;
            width: 72px;
            height: 72px;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            scroll-snap-align: start;
            transition: 0.25s ease;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 4px;
        }

        .thumbnail-strip .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .thumbnail-strip .thumb-item:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .thumbnail-strip .thumb-item.active-thumb {
            border-color: #d4af37 !important;
            box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.2), 0 0 18px rgba(212, 175, 55, 0.08);
        }

        /* ── IMAGE DOTS ── */
        .image-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-height: 14px;
            margin-top: 10px;
        }

        .image-dot {
            width: 6px;
            height: 6px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .image-dot.active {
            width: 8px;
            height: 8px;
            background: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* ── COLOR SECTION ── */
        .color-section {
            margin-top: 16px;
            padding: 16px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
        }

        .color-section label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .color-section label span {
            color: #d4af37;
        }

        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 18px;
        }

        .color-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: 0.25s ease;
            min-width: 60px;
        }

        .color-opt .swatch {
            width: 76px;
            height: 76px;
            border-radius: 14px;
            object-fit: contain;
            background: #0b0b0b;
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: 0.25s ease;
            padding: 5px;
        }

        .color-opt:hover .swatch {
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }

        .color-opt.active .swatch {
            border-color: #d4af37 !important;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15), 0 0 24px rgba(212, 175, 55, 0.12);
        }

        .color-opt .color-name {
            color: #bdbdbd;
            font-size: 10px;
            font-weight: 500;
            text-align: center;
            line-height: 1.3;
            max-width: 72px;
            white-space: normal;
            overflow: visible;
        }

        .color-opt.active .color-name {
            color: #d4af37;
        }

        /* ── VARIANT SECTION ── */
        .variant-section {
            margin-top: 12px;
            padding: 16px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
        }

        .variant-section label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .variant-section label span {
            color: #d4af37;
        }

        .variant-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        .variant-options .opt {
            min-width: 0;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #101010;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            color: #bdbdbd;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s ease;
            text-align: center;
        }

        .variant-options .opt:hover {
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }

        .variant-options .opt.active {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.07);
            border-color: #d4af37;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.08);
        }

        .variant-options .opt .variant-price {
            margin-top: 3px;
            color: #d4af37;
            font-size: 14px;
            font-weight: 700;
        }

        /* ── STORAGE / RAM / WARRANTY (NEW) ── */
        .storage-ram-warranty {
            margin-top: 12px;
            padding: 16px 18px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
        }

        .storage-ram-warranty label {
            display: block;
            margin-bottom: 12px;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .storage-ram-warranty label span {
            color: #d4af37;
        }

        .storage-ram-warranty .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .storage-ram-warranty .badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .storage-ram-warranty .badge.gold {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }

        /* ── RIGHT COLUMN ── */
        .product-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-card {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 14px;
            transition: 0.25s ease;
        }

        .info-card:hover {
            border-color: rgba(212, 175, 55, 0.10);
        }

        .product-name {
            margin: 0;
            color: #fff;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: 700;
            line-height: 1.25;
        }

        .product-price {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 8px 0 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-price .current {
            color: #d4af37;
            font-size: clamp(24px, 2.5vw, 32px);
            font-weight: 700;
        }

        .product-price .old {
            color: #666;
            font-size: 15px;
            text-decoration: line-through;
        }

        .product-price .discount-badge {
            padding: 3px 10px;
            color: #4ecdc4;
            background: rgba(78, 205, 196, 0.08);
            border: 1px solid rgba(78, 205, 196, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .product-description {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #b8b8b8;
            font-size: 14px;
            line-height: 1.7;
        }

        /* ── PRODUCT HIGHLIGHTS ── */
        .product-highlights {
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            margin-top: 4px;
            transition: 0.25s ease;
        }

        .product-highlights:hover {
            border-color: rgba(212, 175, 55, 0.15);
        }

        .highlights-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding: 4px 0;
        }

        .highlights-header h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .highlights-header h3::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 2px;
            margin-left: 10px;
            background: linear-gradient(90deg, #d4af37, transparent);
            border-radius: 2px;
            vertical-align: middle;
        }

        .highlights-header .toggle-icon {
            color: #d4af37;
            font-size: 18px;
            transition: transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .highlights-header .toggle-icon.collapsed {
            transform: rotate(180deg);
        }

        .highlights-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            padding: 12px 0 4px;
            transition: all 0.3s ease;
            overflow: hidden;
            max-height: 500px;
        }

        .highlights-grid.collapsed {
            max-height: 0;
            padding: 0;
            opacity: 0;
        }

        .highlight-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.12);
            border-radius: 30px;
            color: #e8e8e8;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .highlight-chip .chip-icon {
            font-size: 16px;
            color: #d4af37;
        }

        .highlight-chip .chip-label {
            color: #999;
            font-weight: 400;
            margin-right: 2px;
        }

        .highlight-chip .chip-value {
            color: #fff;
            font-weight: 600;
        }

        .highlight-chip:hover {
            background: rgba(212, 175, 55, 0.10);
            border-color: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
        }

        /* ── ALL DETAILS ── */
        .all-details {
            background: linear-gradient(145deg, #181818, #111);
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 14px;
            padding: 16px 20px 20px;
            margin-top: 6px;
            transition: 0.25s ease;
        }

        .all-details:hover {
            border-color: rgba(212, 175, 55, 0.15);
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding: 4px 0;
        }

        .details-header h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .details-header h3::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 2px;
            margin-left: 10px;
            background: linear-gradient(90deg, #d4af37, transparent);
            border-radius: 2px;
            vertical-align: middle;
        }

        .details-header .toggle-icon {
            color: #d4af37;
            font-size: 18px;
            transition: transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .details-header .toggle-icon.collapsed {
            transform: rotate(180deg);
        }

        .details-body {
            transition: all 0.3s ease;
            overflow: hidden;
            max-height: 2000px;
        }

        .details-body.collapsed {
            max-height: 0;
            opacity: 0;
            padding-top: 0 !important;
        }

        .details-body {
            padding-top: 14px;
        }

        /* ── TABS ── */
        .details-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .details-tab {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #888;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .details-tab:hover {
            color: #d4af37;
        }

        .details-tab.active {
            color: #d4af37;
            border-bottom-color: #d4af37;
            background: rgba(212, 175, 55, 0.04);
            border-radius: 4px 4px 0 0;
        }

        /* ── TAB CONTENT ── */
        .tab-content {
            display: none;
            animation: tabFade 0.3s ease;
            padding: 4px 0;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes tabFade {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── SHOWCASE ── */
        .showcase-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .showcase-gallery .showcase-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #0a0a0a;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px;
            transition: 0.25s ease;
        }

        .showcase-gallery .showcase-img:hover {
            border-color: rgba(212, 175, 55, 0.2);
            transform: scale(1.02);
        }

        .showcase-description {
            color: #b8b8b8;
            font-size: 13px;
            line-height: 1.8;
            margin: 8px 0 4px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border-left: 3px solid rgba(212, 175, 55, 0.2);
        }

        /* ── SPECIFICATIONS TABLE ── */
        .specs-group {
            margin-bottom: 16px;
        }

        .specs-group:last-child {
            margin-bottom: 0;
        }

        .specs-group-title {
            color: #d4af37;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .specs-group-title .sg-icon {
            font-size: 16px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .specs-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.035);
        }

        .specs-table tr:last-child {
            border-bottom: none;
        }

        .specs-table td {
            padding: 8px 4px;
            color: #b8b8b8;
        }

        .specs-table .spec-label {
            color: #888;
            font-weight: 400;
            width: 40%;
            padding-right: 12px;
        }

        .specs-table .spec-value {
            color: #e8e8e8;
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }

        .specs-table .spec-value.gold {
            color: #d4af37;
        }

        /* ── WARRANTY TAB ── */
        .warranty-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .warranty-details .warranty-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border-left: 3px solid rgba(212, 175, 55, 0.2);
        }

        .warranty-details .warranty-item .wi-icon {
            font-size: 20px;
            color: #d4af37;
        }

        .warranty-details .warranty-item .wi-text {
            color: #e8e8e8;
            font-size: 13px;
        }

        .warranty-details .warranty-item .wi-text strong {
            color: #d4af37;
        }

        /* ── MANUFACTURER TAB ── */
        .manufacturer-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .manufacturer-details .mfr-row {
            display: flex;

        <button class="buy-btn" onclick="buyNow()">⚡ Buy Now</button>

    <!-- ─── SCRIPTS ─── -->
    <script src="config.js"></script>

    <script src="tv.js"></script>

    <script>
        // ==========================================
        // PRODUCT PAGE - WITH HIGHLIGHTS + ALL DETAILS
        // ==========================================

        let currentProduct = null;
        let selectedColorName = null;
        let selectedVariantLabel = null;
        let selectedVariantPrice = 0;
        let selectedVariantOldPrice = 0;

        // ── TOGGLE FUNCTIONS ──
        function toggleHighlights() {
            const grid = document.getElementById('highlightsGrid');
            const icon = document.getElementById('highlightsToggle');
            if (grid) {
                grid.classList.toggle('collapsed');
                icon.classList.toggle('collapsed');
            }
        }

        function toggleDetails() {
            const body = document.getElementById('detailsBody');
            const icon = document.getElementById('detailsToggle');
            if (body) {
                body.classList.toggle('collapsed');
                icon.classList.toggle('collapsed');
            }
        }

        // ── TOAST ──
        function showToast(msg) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerHTML =
                `<span>${msg}</span><button onclick="this.parentElement.remove()">✕</button>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ── GET PRODUCT ID ──
        function getProductIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || params.get('product') || params.get('p');
        }

        // ==========================================
        // GALLERY
        // ==========================================
        function updateGallery(images) {
            const box = document.getElementById('galleryContainer');
            const track = document.getElementById('galleryTrack');
            const strip = document.getElementById('thumbnailStrip');
            const dots = document.getElementById('imageDots');

            if (!box || !track || !strip || !dots) return;

            strip.innerHTML = '';
            dots.innerHTML = '';
            track.innerHTML = '';

            let validImages = (images || []).filter(src =>
                typeof src === 'string' && src.trim() !== ''
            );
            if (validImages.length === 0) {
                validImages = ['#'];
            }

            dots.style.display = 'flex';
            strip.style.display = 'flex';

            let currentIndex = 0;
            let startX = 0,
                startY = 0;
            let currentTranslate = 0,
                dragStartTranslate = 0;
            let isDragging = false,
                moved = false;

            validImages.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = 'gallery-slide';
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Product image ${index + 1}`;
                img.draggable = false;
                slide.appendChild(img);
                track.appendChild(slide);
            });

            function getSlideWidth() {
                const cs = getComputedStyle(box);
                const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
                return Math.max(1, box.clientWidth - padX);
            }

            function syncGalleryGeometry() {
                const slideWidth = getSlideWidth();
                const count = validImages.length;
                track.style.width = `${slideWidth * count}px`;
                track.style.height = '100%';
                const slides = track.querySelectorAll('.gallery-slide');
                slides.forEach((slide) => {
                    slide.style.width = `${slideWidth}px`;
                    slide.style.minWidth = `${slideWidth}px`;
                    slide.style.maxWidth = `${slideWidth}px`;
                    slide.style.height = '100%';
                    slide.style.flex = '0 0 auto';
                });
                if (currentIndex >= 0 && currentIndex < count) {
                    currentTranslate = -currentIndex * slideWidth;
                    track.style.transform = `translate3d(${currentTranslate}px, 0, 0)`;
                }
            }

            function showImage(index, animate = true) {
                if (index < 0) index = 0;
                if (index > validImages.length - 1) index = validImages.length - 1;
                currentIndex = index;
                const slideWidth = getSlideWidth();
                currentTranslate = -index * slideWidth;
                track.classList.toggle('is-dragging', !animate);
                track.classList.toggle('is-snapping', animate);
                track.style.transform = `translate3d(${currentTranslate}px, 0, 0)`;
                const thumbs = strip.querySelectorAll('.thumb-item');
                thumbs.forEach((el, i) => el.classList.toggle('active-thumb', i === currentIndex));
                const dotEls = dots.querySelectorAll('.image-dot');
                dotEls.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
                const activeThumb = strip.querySelector('.active-thumb');
                if (activeThumb) {
                    activeThumb.scrollIntoView({ behavior: animate ? 'smooth' : 'auto', inline: 'center',
                        block: 'nearest' });
                }
            }

            validImages.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'thumb-item' + (index === 0 ? ' active-thumb' : '');
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Thumbnail ${index + 1}`;
                img.loading = 'lazy';
                item.appendChild(img);
                item.addEventListener('click', () => showImage(index, true));
                strip.appendChild(item);
            });

            validImages.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'image-dot' + (index === 0 ? ' active' : '');
                dot.setAttribute('aria-label', `Image ${index + 1}`);
                dot.addEventListener('click', () => showImage(index, true));
                dots.appendChild(dot);
            });

            syncGalleryGeometry();
            showImage(0, false);

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    syncGalleryGeometry();
                    showImage(currentIndex, false);
                }, 80);
            });

            // Touch events
            function onTouchStart(e) {
                if (!e.touches || !e.touches[0]) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dragStartTranslate = currentTranslate;
                isDragging = true;
                moved = false;
                box.classList.add('dragging');
                track.classList.add('is-dragging');
            }

            function onTouchMove(e) {
                if (!isDragging || !e.touches || !e.touches[0]) return;
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                if (Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 10) return;
                moved = true;
                let next = dragStartTranslate + dx;
                const slideWidth = getSlideWidth();
                const maxTranslate = -(validImages.length - 1) * slideWidth;
                if (currentIndex === 0 && dx > 0) next = dragStartTranslate + dx * 0.28;
                if (currentIndex === validImages.length - 1 && dx < 0) next = dragStartTranslate + dx * 0.28;
                if (next > 0) next = 0;
                if (next < maxTranslate) next = maxTranslate;
                track.style.transform = `translate3d(${next}px, 0, 0)`;
            }

            function onTouchEnd(e) {
                if (!isDragging) return;
                const dx = e.changedTouches[0].clientX - startX;
                const slideWidth = getSlideWidth();
                const threshold = Math.max(40, slideWidth * 0.18);
                isDragging = false;
                box.classList.remove('dragging');
                if (moved && Math.abs(dx) >= threshold) {
                    if (dx < 0 && currentIndex < validImages.length - 1) { showImage(currentIndex + 1, true); return; }
                    if (dx > 0 && currentIndex > 0) { showImage(currentIndex - 1, true); return; }
                }
                showImage(currentIndex, true);
            }

            box.addEventListener('touchstart', onTouchStart, { passive: true });
            box.addEventListener('touchmove', onTouchMove, { passive: true });
            box.addEventListener('touchend', onTouchEnd, { passive: true });

            let mouseDown = false;
            box.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                mouseDown = true;
                startX = e.clientX;
                dragStartTranslate = currentTranslate;
                moved = false;
                box.classList.add('dragging');
                track.classList.add('is-dragging');
            });
            window.addEventListener('mousemove', e => {
                if (!mouseDown) return;
                const dx = e.clientX - startX;
                if (Math.abs(dx) > 4) moved = true;
                let next = dragStartTranslate + dx;
                const slideWidth = getSlideWidth();
                const maxTranslate = -(validImages.length - 1) * slideWidth;
                if (currentIndex === 0 && dx > 0) next = dragStartTranslate + dx * 0.28;
                if (currentIndex === validImages.length - 1 && dx < 0) next = dragStartTranslate + dx * 0.28;
                if (next > 0) next = 0;
                if (next < maxTranslate) next = maxTranslate;
                track.style.transform = `translate3d(${next}px, 0, 0)`;
            });
            window.addEventListener('mouseup', e => {
                if (!mouseDown) return;
                mouseDown = false;
                box.classList.remove('dragging');
                const dx = e.clientX - startX;
                const slideWidth = getSlideWidth();
                const threshold = Math.max(40, slideWidth * 0.18);
                if (moved && Math.abs(dx) >= threshold) {
                    if (dx < 0 && currentIndex < validImages.length - 1) { showImage(currentIndex + 1, true); return; }
                    if (dx > 0 && currentIndex > 0) { showImage(currentIndex - 1, true); return; }
                }
                showImage(currentIndex, true);
            });
        }

        // ==========================================
        // COLORS
        // ==========================================
        function loadColors(product) {
            const container = document.getElementById('colorOptions');
            const section = document.getElementById('colorSection');
            container.innerHTML = '';
            let colors = product.colors || [];
            if (!colors || colors.length === 0) {
                section.style.display = 'none';
                updateGallery(['#']);
                return;
            }
            section.style.display = 'block';
            let firstImages = (colors[0].images && colors[0].images.length > 0) ? colors[0].images : ['#'];
            updateGallery(firstImages);

            colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'color-opt' + (index === 0 ? ' active' : '');
                btn.dataset.index = index;
                let colorImages = (color.images && color.images.length > 0) ? color.images : ['#'];
                const swatch = document.createElement('img');
                swatch.className = 'swatch';
                swatch.src = colorImages[0] || '#';
                swatch.alt = color.name || '';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'color-name';
                nameSpan.textContent = color.name || 'Default';
                btn.appendChild(swatch);
                btn.appendChild(nameSpan);
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    selectedColorName = this.querySelector('.color-name').textContent;
                    updateGallery(colorImages);
                    showToast(`Selected: ${selectedColorName}`);
                });
                container.appendChild(btn);
            });
        }

        // ==========================================
        // VARIANTS
        // ==========================================
        function loadVariants(product) {
            const container = document.getElementById('variantOptions');
            container.innerHTML = '';
            let variants = product.variants || [];
            if (!variants || variants.length === 0) {
                variants = [{ label: 'Default', price: product.price || 0, oldPrice: product.oldPrice || 0 }];
            }
            variants.forEach((variant, index) => {
                const el = document.createElement('button');
                el.className = 'opt' + (index === 0 ? ' active' : '');
                el.innerHTML =
                    `<span>${variant.label || 'Default'}</span><span class="variant-price">₹${(variant.price || 0).toLocaleString('en-IN')}</span>`;
                el.dataset.price = variant.price || 0;
                el.dataset.oldPrice = variant.oldPrice || variant.price * 1.3 || 0;
                el.dataset.label = variant.label || 'Default';
                if (index === 0) {
                    selectedVariantLabel = variant.label || 'Default';
                    selectedVariantPrice = variant.price || 0;
                    selectedVariantOldPrice = variant.oldPrice || variant.price * 1.3 || 0;
                }
                el.addEventListener('click', function() {
                    document.querySelectorAll('.variant-options .opt').forEach(o => o.classList.remove(
                    'active'));
                    this.classList.add('active');
                    const price = parseInt(this.dataset.price) || 0;
                    const oldPrice = parseInt(this.dataset.oldPrice) || 0;
                    const label = this.dataset.label || 'Default';
                    updateProductPrice(price, oldPrice, label);
                    showToast(`Selected: ${label}`);
                });

        // ==========================================
        // UPDATE PRICE
        // ==========================================
        function updateProductPrice(price, oldPrice, variantLabel) {
            selectedVariantLabel = variantLabel;
            selectedVariantPrice = price;
            selectedVariantOldPrice = oldPrice;
            document.getElementById('productPrice').innerText = `₹${price.toLocaleString('en-IN')}`;
            document.getElementById('productOldPrice').innerText = `₹${oldPrice.toLocaleString('en-IN')}`;
            const discount = oldPrice > 0 ? Math.round(((oldPrice - price) / oldPrice) * 100) : 0;
            document.getElementById('productDiscount').innerText = discount > 0 ? `${discount}% off` : '';
            document.getElementById('stickyPrice').innerHTML =
                `₹${price.toLocaleString('en-IN')} <small>₹${oldPrice.toLocaleString('en-IN')}</small>`;
        }

        function loadSimilarProducts(product) {
            const similar = allProducts.filter(p => p.id !== product.id && p.category === product.category).slice(0, 6);

            container.innerHTML = '';
            if (similar.length === 0) {

            similar.forEach(p => {

                const imgSrc = p.image || (p.images && p.images[0]) || '#';
                div.innerHTML =

        // ==========================================

        // ==========================================
        function renderFavoriteButton(product) {
            const container = document.getElementById('galleryContainer');
            if (!container) return;
            const oldBtn = container.querySelector('.product-fav-btn');
            if (oldBtn) oldBtn.remove();
            let isFav = false;
            if (typeof isFavorite === 'function') {
                isFav = isFavorite(product.id);
            }
            const btn = document.createElement('button');
            btn.className = `product-fav-btn ${isFav ? 'is-fav' : ''}`;
            btn.setAttribute('data-product-id', product.id);
            btn.innerHTML = `<i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>`;
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (typeof toggleFavorite === 'function') {
                    toggleFavorite(product.id);
                    const isNowFav = isFavorite(product.id);
                    this.classList.toggle('is-fav', isNowFav);
                    this.innerHTML = `<i class="fa-${isNowFav ? 'solid' : 'regular'} fa-heart"></i>`;
                } else {
                    showToast('Favorites feature not loaded');
                }
            });
            container.style.position = 'relative';

        function buildHighlights(product) {

            grid.innerHTML = '';

            if (product.highlights && product.highlights.length > 0) {
                product.highlights.forEach(chip => {
                    const el = document.createElement('span');
                    el.className = 'highlight-chip';
                    el.innerHTML =
                        `<span class="chip-icon">${chip.icon || '✦'}</span><span class="chip-label">${chip.label}:</span><span class="chip-value">${chip.value}</span>`;
                    grid.appendChild(el);
                });
                return;
            }

            // Fallback: auto-generate from product data
            const chips = [];
            if (product.brand) chips.push({ icon: '🏷️', label: 'Brand', value: product.brand });
            if (product.condition) chips.push({ icon: '📦', label: 'Condition', value: product.condition });
            if (product.warranty) chips.push({ icon: '🛡️', label: 'Warranty', value: product.warranty });
            if (product.ram) chips.push({ icon: '🧠', label: 'RAM', value: product.ram });
            if (product.storage) chips.push({ icon: '💾', label: 'Storage', value: product.storage });
            if (product.price) chips.push({ icon: '💰', label: 'Price', value: `₹${product.price.toLocaleString('en-IN')}` });

            if (chips.length === 0) {
                grid.innerHTML =
                    '<p style="color:#666;font-size:13px;padding:6px 0;">No highlights available for this product.</p>';
                return;
            }

            chips.forEach(chip => {
                const el = document.createElement('span');
                el.className = 'highlight-chip';
                el.innerHTML =
                    `<span class="chip-icon">${chip.icon}</span><span class="chip-label">${chip.label}:</span><span class="chip-value">${chip.value}</span>`;
                grid.appendChild(el);
            });
        }

        function setupTabs() {

            const contents = {
                showcase: document.getElementById('tab-showcase'),
                specifications: document.getElementById('tab-specifications'),
                warranty: document.getElementById('tab-warranty'),
                manufacturer: document.getElementById('tab-manufacturer')
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));

                        if (contents[key]) {

                    });
                });
            });

                                <div style="font-size:50px;margin-bottom:16px;">🔍</div>
                                <h2 style="color:#D4AF37;font-size:24px;">Product Not Found</h2>
                                <p style="color:#888;margin:8px 0 20px;font-size:14px;">The product you're looking for doesn't exist.</p>
                                <a href="index.html" style="display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#D4AF37,#F3CF55);color:#0A0A0A;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Return to Store</a>
                            </div>
                        `;
                return;
            }
            renderProduct(productData);
        }

        // ==========================================
        // ACTIONS
        // ==========================================
        function contactWhatsApp() {
            if (!currentProduct) return;
            const price = document.getElementById('productPrice').innerText;
            const color = selectedColorName ? ` (Color: ${selectedColorName})` : '';
            const variant = selectedVariantLabel ? ` (Variant: ${selectedVariantLabel})` : '';
            const msg =
                `Hello JB STORE, I am interested in ${currentProduct.name}${color}${variant}. Price: ${price}.`;
            window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function callStore() {
            window.location.href = `tel:${STORE_PHONE}`;
        }

        function addToCartFromProduct() {
            if (!currentProduct) {
                showToast('Product not found!');
                return;
            }
            const variantLabel = selectedVariantLabel || 'Default';
            const price = selectedVariantPrice || currentProduct.price;
            const colorName = selectedColorName || '';

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const variantKey = variantLabel !== 'Default' ? `_${variantLabel}` : '';
            const colorKey = colorName ? `_${colorName}` : '';
            const uniqueId = `${currentProduct.id}${variantKey}${colorKey}`;
            const existingItem = cart.find(item => item.id === uniqueId);

            let displayName = currentProduct.name;
            if (variantLabel !== 'Default') displayName += ` (${variantLabel})`;
            if (colorName) displayName += ` · ${colorName}`;

            if (existingItem) {
                existingItem.quantity += 1;
                showToast(`📦 ${displayName} quantity updated!`);
            } else {
                cart.push({
                    id: uniqueId,
                    name: currentProduct.name,
                    brand: currentProduct.brand,
                    price: price,
                    image: currentProduct.image || currentProduct.images?.[0] || '',
                    quantity: 1,
                    variant: variantLabel,
                    color: colorName
                });
                showToast(`✅ ${displayName} added to cart!`);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function buyNow() {
            addToCartFromProduct();
            setTimeout(() => window.location.href = 'cart.html', 600);
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.querySelectorAll('.cart-badge').forEach(b => {
                b.textContent = total;
                b.style.display = total > 0 ? 'flex' : 'none';
            });
        }

        // ==========================================
        // INIT
        // ==========================================
        function init() {
            if (typeof allProducts === 'undefined' || allProducts.length === 0) {
                console.warn('allProducts not loaded, retrying...');
                setTimeout(() => {
                    if (typeof allProducts !== 'undefined') loadProduct();
                }, 500);
                return;
            }
            loadProduct();
            updateCartBadge();
        }

        // Start
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(init, 100);
        } else {
            document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
        }
        window.addEventListener('load', () => {
            if (typeof allProducts === 'undefined' || allProducts.length === 0) setTimeout(init, 200);
        });

        // Expose
        window.toggleHighlights = toggleHighlights;
        window.toggleDetails = toggleDetails;
        window.contactWhatsApp = contactWhatsApp;
        window.callStore = callStore;
        window.addToCartFromProduct = addToCartFromProduct;
        window.buyNow = buyNow;
        window.updateCartBadge = updateCartBadge;
        window.showToast = showToast;
    </script>

<script src="https://cdn.jsdelivr.net/npm/vconsole"></script>

  var vConsole = new VConsole();
</script>
