<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | JB STORE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <a href="index.html" class="logo">JB <span>STORE</span></a>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off">
    <button type="button" id="searchButton">🔍</button>
    <div id="searchSuggestions" class="search-suggestions"></div>
  </div>
</header>

<!-- ===== CART PAGE ===== -->
<main class="cart-page">

  <!-- Cart Header -->
  <div class="cart-header">
    <div>
      <h1>🛒 Your Cart</h1>
      <p class="cart-subtitle">Review your items before checkout</p>
    </div>
    <span class="cart-count" id="cartCount">0 items</span>
  </div>

  <!-- Cart Items -->
  <div id="cartItemsContainer">
    <div id="cartItems" class="cart-items"></div>

    <!-- Cart Summary -->
    <div id="cartSummary" class="cart-summary" style="display:none;">
      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="cartSubtotal">₹0</strong>
      </div>
      <div class="summary-row">
        <span>Delivery</span>
        <strong style="color:#4ECDC4;">Free</strong>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-row total">
        <span>Total</span>
        <strong id="cartTotalPrice">₹0</strong>
      </div>
      <div class="cart-actions">
        <button class="checkout-btn" onclick="checkout()">
          <span>Proceed to Checkout</span>
          <span>→</span>
        </button>
        <button class="clear-cart-btn" onclick="clearCart()">🗑️ Clear Cart</button>
      </div>
    </div>
  </div>

  <!-- Empty Cart -->
  <div id="emptyCart" class="empty-cart" style="display:block;">
    <div class="empty-icon">🛒</div>
    <h2>Your cart is empty</h2>
    <p>Browse our collection and add items you love</p>
    <a href="index.html" class="shop-now-btn">Start Shopping →</a>
  </div>

</main>

<!-- ===== BOTTOM BAR ===== -->
<div class="bottom-bar">
  <div class="bottom-container">
    <a href="index.html" class="bottom-item">
      <span class="bottom-icon">🏠</span>
      <span class="bottom-label">Home</span>
    </a>
    <a href="index.html" class="bottom-item">
      <span class="bottom-icon">📦</span>
      <span class="bottom-label">Products</span>
    </a>
    <a href="#" class="bottom-item call-item">
      <span class="bottom-icon">📞</span>
      <span class="bottom-label">Call</span>
    </a>
    <a href="cart.html" class="bottom-item active cart-item">
      <span class="bottom-icon">🛒</span>
      <span class="cart-badge" id="cartBadge">0</span>
      <span class="bottom-label">Cart</span>
    </a>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="config.js"></script>
<script src="mobiles.js"></script>
<script src="refrigerator.js"></script>
<script src="washing.js"></script>
<script src="ac.js"></script>
<script src="tv.js"></script>

<script>
// ==========================================
// CART PAGE - WITH VARIANT DISPLAY
// ==========================================

// ===== ALL PRODUCTS =====
const allProducts = [
  ...mobileProducts,
  ...refrigeratorProducts,
  ...washingProducts,
  ...acProducts,
  ...tvProducts
];

// ===== ELEMENTS =====
const cartItemsContainer = document.getElementById('cartItems');
const cartSummary = document.getElementById('cartSummary');
const emptyCart = document.getElementById('emptyCart');
const cartCount = document.getElementById('cartCount');
const cartSubtotal = document.getElementById('cartSubtotal');
const cartTotalPrice = document.getElementById('cartTotalPrice');

// ===== LOAD CART =====
function loadCart() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  
  console.log('Cart items:', cart);
  
  if (cart.length === 0) {
    cartItemsContainer.innerHTML = '';
    cartSummary.style.display = 'none';
    emptyCart.style.display = 'block';
    cartCount.textContent = '0 items';
    updateBadge(0);
    return;
  }
  
  cartItemsContainer.innerHTML = '';
  cartSummary.style.display = 'block';
  emptyCart.style.display = 'none';
  
  let subtotal = 0;
  let totalItems = 0;
  
  cart.forEach((item, index) => {
    const itemTotal = item.price * item.quantity;
    subtotal += itemTotal;
    totalItems += item.quantity;
    
    // Show variant in cart item
    const displayName = item.variant && item.variant !== 'Default' 
      ? `${item.name} (${item.variant})` 
      : item.name;
    
    const cartItem = document.createElement('div');
    cartItem.className = 'cart-item';
    cartItem.innerHTML = `
      <div class="cart-item-image">
        <img src="${item.image || 'images/placeholder.png'}" alt="${item.name}">
      </div>
      <div class="cart-item-info">
        <h3>${displayName}</h3>
        <p class="cart-item-brand">${item.brand} ${item.variant && item.variant !== 'Default' ? '• ' + item.variant : ''}</p>
        <p class="cart-item-price">₹${item.price.toLocaleString("en-IN")}</p>
      </div>
      <div class="cart-item-qty">
        <button class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
        <span class="qty-number">${item.quantity}</span>
        <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
      </div>
      <div class="cart-item-total">
        ₹${itemTotal.toLocaleString("en-IN")}
      </div>
      <button class="remove-btn" onclick="removeItem(${index})" title="Remove item">✕</button>
    `;
    cartItemsContainer.appendChild(cartItem);
  });
  
  cartCount.textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;
  cartSubtotal.textContent = `₹${subtotal.toLocaleString("en-IN")}`;
  cartTotalPrice.textContent = `₹${subtotal.toLocaleString("en-IN")}`;
  
  updateBadge(totalItems);
}

// ===== UPDATE QUANTITY =====
function updateQuantity(index, change) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  
  if (cart[index]) {
    cart[index].quantity += change;
    if (cart[index].quantity <= 0) {
      cart.splice(index, 1);
    }
  }
  
  localStorage.setItem('cart', JSON.stringify(cart));
  loadCart();
  updateCartBadge();
}

// ===== REMOVE ITEM =====
function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  const itemName = cart[index]?.name || 'Item';
  const variant = cart[index]?.variant || '';
  const displayName = variant && variant !== 'Default' ? `${itemName} (${variant})` : itemName;
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  loadCart();
  updateCartBadge();
  showToast(`${displayName} removed from cart`);
}

// ===== CLEAR CART =====
function clearCart() {
  if (confirm('Are you sure you want to clear your cart?')) {
    localStorage.removeItem('cart');
    loadCart();
    updateCartBadge();
    showToast('Cart cleared');
  }
}

// ===== CHECKOUT =====
function checkout() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  if (cart.length === 0) {
    showToast('Your cart is empty!');
    return;
  }
  
  let message = '🛍️ *JB STORE - New Order*%0A%0A';
  let total = 0;
  
  cart.forEach(item => {
    const itemTotal = item.price * item.quantity;
    const displayName = item.variant && item.variant !== 'Default' 
      ? `${item.name} (${item.variant})` 
      : item.name;
    message += `📱 ${displayName}%0A   × ${item.quantity} = ₹${itemTotal.toLocaleString("en-IN")}%0A`;
    total += itemTotal;
  });
  
  message += `%0A💰 *Total: ₹${total.toLocaleString("en-IN")}*%0A%0A`;
  message += `📞 Please confirm my order. Thank you!`;
  
  window.open(`https://wa.me/${STORE_PHONE}?text=${message}`, '_blank');
}

// ===== UPDATE BADGE =====
function updateBadge(count) {
  const badge = document.getElementById('cartBadge');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'flex' : 'none';
  }
}

// ===== TOAST =====
function showToast(message) {
  const existing = document.querySelector('.toast-notification');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.className = 'toast-notification';
  toast.innerHTML = `
    <span>${message}</span>
    <button onclick="this.parentElement.remove()">✕</button>
  `;
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ===== UPDATE CART BADGE (Global) =====
function updateCartBadge() {
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const total = cart.reduce((sum, item) => sum + item.quantity, 0);
  
  document.querySelectorAll('.cart-badge').forEach(badge => {
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
  });
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
  loadCart();
  updateCartBadge();
});

// ===== SEARCH SUGGESTIONS =====
const searchInput = document.getElementById('searchInput');
const searchSuggestions = document.getElementById('searchSuggestions');

if (searchInput) {
  searchInput.addEventListener('input', function() {
    const text = this.value.trim().toLowerCase();
    searchSuggestions.innerHTML = '';
    
    if (text === '') {
      searchSuggestions.classList.remove('show');
      return;
    }
    
    const matches = allProducts.filter(p => 
      p.name.toLowerCase().includes(text) || 
      p.brand.toLowerCase().includes(text)
    ).slice(0, 6);
    
    if (matches.length === 0) {
      searchSuggestions.innerHTML = `<div class="search-no-result">No products found</div>`;
      searchSuggestions.classList.add('show');
      return;
    }
    
    matches.forEach(product => {
      const div = document.createElement('div');
      div.className = 'search-suggestion';
      div.innerHTML = `
        <img src="${product.image}" alt="">
        <div class="suggestion-info">
          <div class="suggestion-name">${product.name}</div>
          <div class="suggestion-category">${product.brand}</div>
        </div>
      `;
      div.addEventListener('click', () => {
        window.location.href = `product.html?id=${product.id}`;
      });
      searchSuggestions.appendChild(div);
    });
    
    searchSuggestions.classList.add('show');
  });
  
  document.addEventListener('click', function(e) {
    if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
      searchSuggestions.classList.remove('show');
    }
  });
  
  document.getElementById('searchButton')?.addEventListener('click', function() {
    const val = searchInput.value.trim();
    if (val) window.location.href = `search.html?q=${encodeURIComponent(val)}`;
  });
  
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const val = this.value.trim();
      if (val) window.location.href = `search.html?q=${encodeURIComponent(val)}`;
    }
  });
}
</script>

</body>
</html>
