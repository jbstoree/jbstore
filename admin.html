<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Admin - JB STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; font-family: 'Poppins', sans-serif; color: #e0e0e0; padding: 16px; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Login */
    .login-box { max-width: 400px; margin: 80px auto; background: #181818; padding: 40px; border-radius: 20px; border: 1px solid #D4AF37; text-align: center; }
    .login-box h2 { color: #D4AF37; }
    .login-box input { width: 100%; padding: 14px; margin: 12px 0; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 16px; }
    .login-box button { padding: 14px 40px; background: #D4AF37; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; }
    
    /* Header */
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 16px 0; border-bottom: 2px solid #D4AF37; margin-bottom: 24px; gap: 12px; }
    .admin-header h1 { color: #D4AF37; font-size: 24px; }
    .admin-header .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .admin-header select, .admin-header button { padding: 10px 16px; border-radius: 8px; background: #222; border: 1px solid #444; color: #fff; font-family: 'Poppins', sans-serif; cursor: pointer; }
    .admin-header .logout-btn { background: #333; border: 1px solid #666; }
    .admin-header .logout-btn:hover { background: #ff4444; border-color: #ff4444; }

    /* Add Product Form */
    .add-section { background: #141414; border: 1px solid #D4AF37; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
    .add-section h3 { margin-bottom: 12px; color: #D4AF37; }
    .add-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .add-grid input, .add-grid textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: 'Poppins', sans-serif; }
    .add-grid textarea { grid-column: 1 / -1; min-height: 60px; }
    .add-actions { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .add-actions button { padding: 10px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; }
    .btn-gold { background: #D4AF37; color: #000; }
    .btn-green { background: #25D366; color: #000; }
    .btn-red { background: #ff4444; color: #fff; }

    /* Product List */
    .product-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    .product-card { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; transition: 0.3s; }
    .product-card:hover { border-color: #D4AF37; }
    .product-card .main-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .product-card .main-row .thumb { width: 100px; height: 100px; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .product-card .main-row .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .product-card .main-row .fields { flex: 1; min-width: 200px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .product-card .main-row .fields input, .product-card .main-row .fields select { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; color: #fff; font-family: 'Poppins', sans-serif; width: 100%; }
    .product-card .main-row .fields textarea { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; color: #fff; font-family: 'Poppins', sans-serif; width: 100%; grid-column: 1 / -1; min-height: 50px; }

    /* Advanced Toggle */
    .adv-toggle { color: #D4AF37; cursor: pointer; margin: 12px 0; display: inline-block; font-weight: 600; }
    .adv-content { display: none; margin-top: 12px; border-top: 1px solid #2a2a2a; padding-top: 16px; }
    .adv-content.open { display: block; }
    
    .adv-section { margin-bottom: 16px; }
    .adv-section h4 { color: #aaa; margin-bottom: 8px; font-size: 14px; letter-spacing: 1px; }
    .dynamic-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; align-items: center; background: #0a0a0a; padding: 6px 10px; border-radius: 6px; border-left: 2px solid #D4AF37; }
    .dynamic-row input { flex: 1; min-width: 100px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 6px 10px; color: #fff; }
    .dynamic-row .remove-row { background: transparent; border: none; color: #ff4444; font-size: 18px; cursor: pointer; padding: 0 6px; }
    .add-row-btn { background: transparent; border: 1px dashed #666; color: #ccc; padding: 4px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; margin-top: 4px; }

    .card-actions { display: flex; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #222; flex-wrap: wrap; }
    .card-actions button { padding: 8px 20px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .btn-update { background: #D4AF37; color: #000; }
    .btn-delete { background: #ff4444; color: #fff; }

    .status-msg { padding: 8px 12px; border-radius: 6px; background: #1a1a1a; border-left: 4px solid #D4AF37; margin-top: 8px; }
    .hidden { display: none; }
    .badge { background: #D4AF37; color: #000; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>

<div class="container" id="app">

  <!-- LOGIN -->
  <div id="loginSection" class="login-box">
    <h2>🔐 JB STORE Admin</h2>
    <p style="color:#888; margin-bottom:10px;">Enter Password</p>
    <input type="password" id="adminPassword" placeholder="Password: admin123" />
    <button onclick="loginAdmin()">Login</button>
    <p id="loginError" style="color:red; margin-top:10px;"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="adminPanel" class="hidden">
    <div class="admin-header">
      <h1>🛠️ Product Manager</h1>
      <div class="actions">
        <select id="categoryFilter" onchange="loadProductsForAdmin()">
          <option value="">📂 All Categories</option>
          <option value="mobiles">📱 Mobiles</option>
          <option value="sealpack">📦 Seal Pack</option>
          <option value="sealcut">✂️ Seal Cut</option>
          <option value="second">🔄 2nd Hand</option>
          <option value="fridge">🧊 Refrigerators</option>
          <option value="washing">👕 Washing</option>
          <option value="ac">❄️ AC</option>
          <option value="tv">🖥️ TV</option>
        </select>
        <button class="logout-btn" onclick="logoutAdmin()">🚪 Logout</button>
      </div>
    </div>

    <!-- ADD NEW PRODUCT -->
    <div class="add-section">
      <h3>➕ Add New Product</h3>
      <div class="add-grid">
        <input id="newId" placeholder="ID (e.g. MOB999)" />
        <input id="newName" placeholder="Name *" />
        <input id="newBrand" placeholder="Brand" />
        <select id="newCategory">
          <option value="mobiles">Mobiles</option>
          <option value="sealpack">Seal Pack</option>
          <option value="sealcut">Seal Cut</option>
          <option value="second">2nd Hand</option>
          <option value="fridge">Refrigerator</option>
          <option value="washing">Washing</option>
          <option value="ac">AC</option>
          <option value="tv">TV</option>
        </select>
        <input id="newPrice" placeholder="Price" type="number" />
        <input id="newOldPrice" placeholder="Old Price" type="number" />
        <input id="newCondition" placeholder="Condition (Seal Pack)" />
        <input id="newImage" placeholder="Main Image URL" />
        <textarea id="newDescription" placeholder="Description"></textarea>
      </div>
      <div class="add-actions">
        <button class="btn-gold" onclick="addProduct()">➕ Add Product</button>
      </div>
      <div id="newUploadStatus" class="status-msg hidden"></div>
    </div>

    <!-- PRODUCT LIST -->
    <h3>📦 All Products <span id="productCount" class="badge"></span></h3>
    <div id="productList" class="product-grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========== CONFIG ==========
  const SUPABASE_URL = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ'; // 🔑 REPLACE THIS WITH YOUR KEY
  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON);

  let currentProducts = [];

  // ========== AUTH ==========
  function loginAdmin() {
    const pass = document.getElementById('adminPassword').value;
    if (pass === 'admin123') {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      loadProductsForAdmin();
    } else {
      document.getElementById('loginError').innerText = '❌ Wrong Password!';
    }
  }
  function logoutAdmin() {
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('adminPassword').value = '';
  }

  // ========== LOAD PRODUCTS ==========
  async function loadProductsForAdmin() {
    const category = document.getElementById('categoryFilter').value;
    let query = supabaseClient.from('products').select('*');
    if (category) query = query.eq('category', category);
    
    const { data, error } = await query;
    if (error) { alert('Error loading'); return; }
    currentProducts = data;
    document.getElementById('productCount').innerText = data.length;
    renderProducts(data);
  }

  function renderProducts(products) {
    const container = document.getElementById('productList');
    container.innerHTML = '';
    if (products.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">No products found.</div>';
      return;
    }

    products.forEach((p, index) => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.dataset.index = index;
      card.dataset.id = p.id;

      // Build colors input rows
      let colorsHtml = '';
      const colors = p.colors || [];
      if (colors.length === 0) {
        colorsHtml = `<div class="dynamic-row">
          <input placeholder="Color Name (e.g. Ice Blue)" value="" class="color-name" />
          <input placeholder="Image URLs (comma separated)" value="" class="color-images" />
          <button class="remove-row" onclick="removeRow(this)">✕</button>
        </div>`;
      } else {
        colors.forEach(c => {
          colorsHtml += `<div class="dynamic-row">
            <input placeholder="Color Name" value="${c.name || ''}" class="color-name" />
            <input placeholder="Image URLs (comma separated)" value="${(c.images || []).join(', ')}" class="color-images" />
            <button class="remove-row" onclick="removeRow(this)">✕</button>
          </div>`;
        });
      }

      // Build variants rows
      let variantsHtml = '';
      const variants = p.variants || [];
      if (variants.length === 0) {
        variantsHtml = `<div class="dynamic-row">
          <input placeholder="Label (e.g. 4GB+64GB)" value="" class="var-label" />
          <input placeholder="Price" type="number" value="" class="var-price" />
          <button class="remove-row" onclick="removeRow(this)">✕</button>
        </div>`;
      } else {
        variants.forEach(v => {
          variantsHtml += `<div class="dynamic-row">
            <input placeholder="Label" value="${v.label || ''}" class="var-label" />
            <input placeholder="Price" type="number" value="${v.price || ''}" class="var-price" />
            <button class="remove-row" onclick="removeRow(this)">✕</button>
          </div>`;
        });
      }

      card.innerHTML = `
        <div class="main-row">
          <div class="thumb">
            <img src="${p.image || 'https://via.placeholder.com/100/333/fff?text=No+Image'}" onerror="this.src='https://via.placeholder.com/100/333/fff?text=No+Image'" />
          </div>
          <div class="fields">
            <input type="text" class="edit-name" value="${p.name || ''}" placeholder="Name" />
            <input type="text" class="edit-brand" value="${p.brand || ''}" placeholder="Brand" />
            <input type="number" class="edit-price" value="${p.price || 0}" placeholder="Price" />
            <input type="number" class="edit-oldprice" value="${p.oldPrice || 0}" placeholder="Old Price" />
            <input type="text" class="edit-condition" value="${p.condition || ''}" placeholder="Condition" />
            <input type="text" class="edit-warranty" value="${p.warranty || ''}" placeholder="Warranty" />
            <input type="text" class="edit-storage" value="${p.storage || ''}" placeholder="Storage" />
            <input type="text" class="edit-ram" value="${p.ram || ''}" placeholder="RAM" />
            <input type="text" class="edit-capacity" value="${p.capacity || ''}" placeholder="Capacity" />
            <input type="text" class="edit-type" value="${p.type || ''}" placeholder="Type" />
            <input type="text" class="edit-energy" value="${p.energyRating || ''}" placeholder="Energy Rating" />
            <input type="text" class="edit-size" value="${p.size || ''}" placeholder="Size" />
            <input type="text" class="edit-resolution" value="${p.resolution || ''}" placeholder="Resolution" />
            <input type="text" class="edit-image" value="${p.image || ''}" placeholder="Main Image URL" />
            <textarea class="edit-description" placeholder="Description">${p.description || ''}</textarea>
          </div>
        </div>

        <div class="adv-toggle" onclick="toggleAdv(this)">▼ Advanced (Colors & Variants)</div>
        <div class="adv-content">
          <div class="adv-section">
            <h4>🎨 Colors & Gallery Images</h4>
            <div class="colors-container">${colorsHtml}</div>
            <button class="add-row-btn" onclick="addColorRow(this)">+ Add Color</button>
          </div>
          <div class="adv-section">
            <h4>📱 Variants (Storage/RAM Prices)</h4>
            <div class="variants-container">${variantsHtml}</div>
            <button class="add-row-btn" onclick="addVariantRow(this)">+ Add Variant</button>
          </div>
        </div>

        <div class="card-actions">
          <button class="btn-update" onclick="updateProductFull('${p.id}')">💾 Save All Changes</button>
          <button class="btn-delete" onclick="deleteProduct('${p.id}')">🗑️ Delete Product</button>
          <span id="status_${p.id}" style="color:#aaa; font-size:13px; align-self:center;"></span>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // ========== TOGGLE ADVANCED ==========
  function toggleAdv(el) {
    const content = el.nextElementSibling;
    content.classList.toggle('open');
    el.innerText = content.classList.contains('open') ? '▲ Hide Advanced' : '▼ Advanced (Colors & Variants)';
  }

  // ========== DYNAMIC ROWS ==========
  function addColorRow(btn) {
    const container = btn.previousElementSibling;
    const row = document.createElement('div');
    row.className = 'dynamic-row';
    row.innerHTML = `
      <input placeholder="Color Name" class="color-name" />
      <input placeholder="Image URLs (comma separated)" class="color-images" />
      <button class="remove-row" onclick="removeRow(this)">✕</button>
    `;
    container.appendChild(row);
  }

  function addVariantRow(btn) {
    const container = btn.previousElementSibling;
    const row = document.createElement('div');
    row.className = 'dynamic-row';
    row.innerHTML = `
      <input placeholder="Label (e.g. 4GB+64GB)" class="var-label" />
      <input placeholder="Price" type="number" class="var-price" />
      <button class="remove-row" onclick="removeRow(this)">✕</button>
    `;
    container.appendChild(row);
  }

  function removeRow(btn) {
    const row = btn.parentElement;
    const container = row.parentElement;
    if (container.children.length > 1) {
      row.remove();
    } else {
      alert('At least one row is required.');
    }
  }

  // ========== SAVE FULL PRODUCT ==========
  async function updateProductFull(id) {
    const card = document.querySelector(`.product-card[data-id="${id}"]`);
    if (!card) return;

    const statusDiv = document.getElementById(`status_${id}`);
    statusDiv.innerText = '⏳ Saving...';

    // 1. Basic fields
    const name = card.querySelector('.edit-name').value;
    const brand = card.querySelector('.edit-brand').value;
    const price = parseFloat(card.querySelector('.edit-price').value) || 0;
    const oldPrice = parseFloat(card.querySelector('.edit-oldprice').value) || 0;
    const condition = card.querySelector('.edit-condition').value;
    const warranty = card.querySelector('.edit-warranty').value;
    const storage = card.querySelector('.edit-storage').value;
    const ram = card.querySelector('.edit-ram').value;
    const capacity = card.querySelector('.edit-capacity').value;
    const type = card.querySelector('.edit-type').value;
    const energyRating = card.querySelector('.edit-energy').value;
    const size = card.querySelector('.edit-size').value;
    const resolution = card.querySelector('.edit-resolution').value;
    const image = card.querySelector('.edit-image').value;
    const description = card.querySelector('.edit-description').value;

    // 2. Collect Colors
    const colorRows = card.querySelectorAll('.colors-container .dynamic-row');
    const colors = [];
    colorRows.forEach(row => {
      const nameInput = row.querySelector('.color-name');
      const imagesInput = row.querySelector('.color-images');
      if (nameInput && imagesInput) {
        const imgStr = imagesInput.value.trim();
        const images = imgStr ? imgStr.split(',').map(s => s.trim()).filter(s => s) : [];
        if (nameInput.value.trim() || images.length > 0) {
          colors.push({ name: nameInput.value.trim(), images: images });
        }
      }
    });

    // 3. Collect Variants
    const variantRows = card.querySelectorAll('.variants-container .dynamic-row');
    const variants = [];
    variantRows.forEach(row => {
      const labelInput = row.querySelector('.var-label');
      const priceInput = row.querySelector('.var-price');
      if (labelInput && priceInput) {
        if (labelInput.value.trim()) {
          variants.push({
            label: labelInput.value.trim(),
            price: parseFloat(priceInput.value) || 0,
            oldPrice: parseFloat(priceInput.value) || 0 // fallback
          });
        }
      }
    });

    // 4. Build Update Object
    const updateData = {
      name, brand, price, oldPrice, condition, warranty,
      storage, ram, capacity, type, energyRating, size, resolution,
      image, description,
      colors: colors,
      variants: variants
    };

    // 5. Update in Supabase
    const { error } = await supabaseClient
      .from('products')
      .update(updateData)
      .eq('id', id);

    if (error) {
      statusDiv.innerText = '❌ Error: ' + error.message;
    } else {
      statusDiv.innerText = '✅ Saved successfully!';
      // Refresh list after 1 second to show updated data
      setTimeout(() => loadProductsForAdmin(), 1000);
    }
  }

  // ========== DELETE PRODUCT ==========
  async function deleteProduct(id) {
    if (!confirm('Delete this product permanently?')) return;
    const { error } = await supabaseClient.from('products').delete().eq('id', id);
    if (error) alert('Delete failed: ' + error.message);
    else {
      alert('✅ Deleted!');
      loadProductsForAdmin();
    }
  }

  // ========== ADD NEW PRODUCT ==========
  async function addProduct() {
    const id = document.getElementById('newId').value.trim();
    const name = document.getElementById('newName').value.trim();
    if (!id || !name) { alert('ID and Name are required!'); return; }

    const product = {
      id: id,
      name: name,
      brand: document.getElementById('newBrand').value.trim(),
      category: document.getElementById('newCategory').value,
      price: parseFloat(document.getElementById('newPrice').value) || 0,
      oldPrice: parseFloat(document.getElementById('newOldPrice').value) || 0,
      condition: document.getElementById('newCondition').value.trim(),
      image: document.getElementById('newImage').value.trim(),
      description: document.getElementById('newDescription').value.trim(),
      rating: 0, reviews: 0,
      colors: [],
      variants: [],
      warranty: '',
      storage: '', ram: '', capacity: '', type: '', energyRating: '', size: '', resolution: ''
    };

    const { error } = await supabaseClient.from('products').insert(product);
    if (error) { alert('Add failed: ' + error.message); }
    else {
      alert('✅ Product added!');
      // Clear form
      document.querySelectorAll('.add-grid input, .add-grid textarea').forEach(el => el.value = '');
      loadProductsForAdmin();
    }
  }

  // ========== INIT ==========
  document.addEventListener('DOMContentLoaded', () => {
    // Show login by default
  });
</script>
</body>
</html>
