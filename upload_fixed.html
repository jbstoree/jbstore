async function uploadProducts() {
  const btn=document.getElementById('uploadBtn');
  btn.disabled=true;
  btn.textContent='Uploading...';
  log.textContent += '\nStarting upload...\n';

  let success=0, failed=0;
  for (const p of allData) {
    const { error } = await client.from('products').upsert(p, { onConflict:'id' });
    if (error) {
      failed++;
      log.textContent += `❌ ${p.id}: ${error.message}\n`;
    } else {
      success++;
      log.textContent += `✅ ${p.id} uploaded\n`;
    }
  }

  log.textContent += `\n🎉 Done! ${success} uploaded/updated.\n`;
  if (failed) log.textContent += `❌ Failed: ${failed}\n`;
  if (!failed) log.textContent += '✅ Now open admin.html and refresh.\n';
  btn.disabled=false;
  btn.textContent='Upload / Update All Products';
}
